# Permalinks
permalink:        pretty

# Setup
title:            Dan Taylor
tagline:          Math. Data Science. Exposition.
url:              http://dantaylor688.github.io
paginate:         1
baseurl:          http://dantaylor688.github.io/
author:
  name:           Dan Taylor
  url:            https://twitter.com/dantaylor688
  email:          dantaylor688@gmail.com

# Custom vars
version:          1.1.0
github:
  repo:           https://github.com/dantaylor688.github.io

collections:
   sunday-school-lessons:
       output: true

pages_list:
  About: '/about'
  Archive: '/archive'
  Feed: '/atom.xml'
  Misc: '/misc'
  Sunday School: '/sunday-school'

# MathJax
markdown: kramdown
theme: jekyll-bear-theme

#### More settings
plugins:
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from

markdown: kramdown

compress_html:
  clippings: all
  comments: [""]
  endings: [html, head, body, li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  profile: false
  blanklines: false
  ignore:
    envs: []

# sass:
#   sass_dir: css
#   style:    compressed

collections:
  my_tags:
    output: true
    permalink: /tagged/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: tagged

# baseurl: ""
permalink: /blog/:slug
timezone: America/New_York
future: false

exclude:
- README.md
- LICENSE.md

exclude: [vendor]

Blog: /blog

# Add general links to site pages here
links:
  Resume: /assets/dan_taylor_resume.pdf
  

# Add links for more focus here
special_links:
  "Search": https://duckduckgo.com